name: Build workflow
on:
  pull_request:
  push:
    branches: [ "main" ]

# 同一分支的构建串行执行：推送到 main 的构建按触发顺序依次完成，不会出现旧构建后完成的情况；
# PR 上的构建只保留最新一次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ipa
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # 侧载工具靠版本号判断是否有更新：每次发布都递增
      # 1.0.0（build 100）是首个手动发布的版本，自动发布从 1.0.<run_number>（build 100+run_number）开始
      - name: Set version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VERSION="1.0.${{ github.run_number }}"
          BUILD="$((100 + ${{ github.run_number }}))"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            -c "Set :CFBundleVersion $BUILD" \
            "BilibiliLive/Supporting Files/Info.plist"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          fastlane build_unsign_ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AchordTV.ipa
          path: AchordTV.ipa

      # 只在本仓库发布（本仓库在 GitHub 上仍登记为 fork，不能用 repository.fork 判断）。
      # 发布为正式版并标记为 Latest，资产名固定 AchordTV.ipa，供侧载工具获取与自动更新。
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Achordchan/AchordTV-for-BL'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 兜底：若已存在更高版本（例如有构建被手动重跑），本次照常发布但不抢占 Latest
          LATEST="$(gh release view --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || true)"
          LATEST_FLAG="--latest"
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "已有更高版本 $LATEST，本次 $VERSION 不标记为 Latest"
            LATEST_FLAG="--latest=false"
          fi
          gh release create "v$VERSION" AchordTV.ipa \
            --target "$GITHUB_SHA" \
            "$LATEST_FLAG" \
            --title "AchordTV for BL $VERSION" \
            --notes "自动构建：$(git log -1 --pretty=%s)（$(git rev-parse --short HEAD)）。未签名 IPA，请用侧载工具签名安装。"
